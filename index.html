
<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ATWORK | แจ้งความต้องการบุคลากร</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #173B65;
      --blue: #2F72C4;
      --light-blue: #EAF2FC;
      --border: #D6DFEA;
      --text: #24364B;
      --muted: #64748B;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background: #F3F6FA;
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 28px;
      background: #fff;
      border: 1px solid #E7ECF3;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(23, 59, 101, .06);
    }

    .brand {
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      margin: 10px 0;
      color: var(--navy);
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.8;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 16px;
    }

    .field {
      min-width: 0;
    }

    .full,
    .section-title {
      grid-column: 1 / -1;
    }

    .section-title {
      margin-top: 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
      color: var(--navy);
      font-size: 16px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 600;
    }

    .required {
      color: #D93025;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 114, 196, .10);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.7;
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 26px;
      padding: 13px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--navy);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      border: 1px solid #A7E0C2;
      background: #EFFAF4;
      color: #17633C;
    }

    #message.error {
      display: block;
      border: 1px solid #F2B8B5;
      background: #FFF3F2;
      color: #9B2823;
    }

    @media (max-width: 560px) {
      body {
        padding: 10px 7px;
      }

      .container {
        padding: 19px 13px;
        border-radius: 12px;
      }

      h1 {
        font-size: 21px;
      }

      .form-grid {
        gap: 15px 10px;
      }

      input,
      select,
      textarea {
        padding: 10px 9px;
        font-size: 13px;
      }

      .time-grid {
        gap: 10px;
      }
    }

    @media (max-width: 360px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field,
      .full,
      .section-title {
        grid-column: 1;
      }

      .time-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">ATWORK</div>

    <h1>แจ้งความต้องการบุคลากร</h1>

    <p class="subtitle">
      กรอกข้อมูลบริษัทและรายละเอียดตำแหน่งงานที่ต้องการรับสมัคร
      เพื่อให้ทีมงานใช้ประกอบการดำเนินงานสรรหาบุคลากร
    </p>

    <form id="jobRequestForm">
      <div class="form-grid">

        <div class="section-title">ข้อมูลบริษัทและผู้ติดต่อ</div>

        <div class="field full">
          <label for="CompanyName">
            ชื่อบริษัท <span class="required">*</span>
          </label>
          <input
            id="CompanyName"
            name="CompanyName"
            maxlength="200"
            required
            placeholder="ระบุชื่อบริษัท"
          >
        </div>

        <div class="field">
          <label for="ContactName">
            ชื่อผู้ติดต่อ <span class="required">*</span>
          </label>
          <input
            id="ContactName"
            name="ContactName"
            maxlength="150"
            required
            placeholder="ชื่อผู้ประสานงาน"
          >
        </div>

        <div class="field">
          <label for="ContactPhone">
            เบอร์โทรศัพท์ <span class="required">*</span>
          </label>
          <input
            id="ContactPhone"
            name="ContactPhone"
            type="tel"
            maxlength="30"
            required
            placeholder="เบอร์โทรศัพท์ที่ติดต่อได้"
          >
        </div>

        <div class="field full">
          <label for="ContactEmail">อีเมล</label>
          <input
            id="ContactEmail"
            name="ContactEmail"
            type="email"
            maxlength="150"
            placeholder="example@company.com"
          >
        </div>

        <div class="section-title">รายละเอียดตำแหน่งงาน</div>

        <div class="field full">
          <label for="JobTitle">
            ตำแหน่งงาน <span class="required">*</span>
          </label>
          <input
            id="JobTitle"
            name="JobTitle"
            maxlength="200"
            required
            placeholder="เช่น พนักงานคลังสินค้า"
          >
        </div>

        <div class="field">
          <label for="JobType">
            ประเภทงาน <span class="required">*</span>
          </label>
          <select id="JobType" name="JobType" required>
            <option value="">-- เลือกประเภทงาน --</option>
            <option value="งานประจำ">งานประจำ</option>
            <option value="งานรายวัน">งานรายวัน</option>
            <option value="งานชั่วคราว">งานชั่วคราว</option>
            <option value="งานสัญญาจ้าง">งานสัญญาจ้าง</option>
            <option value="อื่น ๆ">อื่น ๆ</option>
          </select>
        </div>

        <div class="field">
          <label for="Headcount">
            จำนวนที่ต้องการ <span class="required">*</span>
          </label>
          <input
            id="Headcount"
            name="Headcount"
            type="number"
            min="1"
            max="10000"
            step="1"
            required
            placeholder="จำนวนคน"
          >
        </div>

        <div class="field">
          <label for="Province">
            จังหวัด <span class="required">*</span>
          </label>
          <input
            id="Province"
            name="Province"
            maxlength="100"
            required
            placeholder="จังหวัดที่ปฏิบัติงาน"
          >
        </div>

        <div class="field">
          <label for="WorkLocation">
            สถานที่ทำงาน <span class="required">*</span>
          </label>
          <input
            id="WorkLocation"
            name="WorkLocation"
            maxlength="500"
            required
            placeholder="ระบุเขต อำเภอ หรือนิคมอุตสาหกรรม"
          >
        </div>

        <div class="section-title">ค่าจ้างและเวลาทำงาน</div>

        <div class="field">
          <label for="SalaryType">
            รูปแบบค่าจ้าง <span class="required">*</span>
          </label>
          <select id="SalaryType" name="SalaryType" required>
            <option value="">-- เลือกรูปแบบค่าจ้าง --</option>
            <option value="รายวัน">รายวัน</option>
            <option value="รายเดือน">รายเดือน</option>
            <option value="รายชั่วโมง">รายชั่วโมง</option>
            <option value="ตามตกลง">ตามตกลง</option>
          </select>
        </div>

        <div class="field">
          <label for="SalaryRange">
            อัตราค่าจ้าง <span class="required">*</span>
          </label>
          <select id="SalaryRange" name="SalaryRange" required>
            <option value="">-- เลือกอัตราค่าจ้าง --</option>
            <option value="ตามตกลง">ตามตกลง</option>
            <option value="ตามประสบการณ์">ตามประสบการณ์</option>
            <option value="9000-10000">9,000–10,000 บาท</option>
            <option value="10001-12000">10,001–12,000 บาท</option>
            <option value="12001-15000">12,001–15,000 บาท</option>
            <option value="15001-18000">15,001–18,000 บาท</option>
            <option value="18001-20000">18,001–20,000 บาท</option>
            <option value="20001-25000">20,001–25,000 บาท</option>
            <option value="25001-30000">25,001–30,000 บาท</option>
            <option value="มากกว่า 30000">มากกว่า 30,000 บาท</option>
          </select>
        </div>

        <div class="field full">
          <label for="WorkDate">
            วันที่ทำงาน <span class="required">*</span>
          </label>
          <input
            id="WorkDate"
            name="WorkDate"
            type="date"
            required
          >
        </div>

        <div class="field full">
          <div class="time-grid">
            <div>
              <label for="StartTime">
                เวลาเริ่มทำงาน <span class="required">*</span>
              </label>
              <input
                id="StartTime"
                name="StartTime"
                type="time"
                required
              >
            </div>

            <div>
              <label for="EndTime">
                เวลาเลิกงาน <span class="required">*</span>
              </label>
              <input
                id="EndTime"
                name="EndTime"
                type="time"
                required
              >
            </div>
          </div>
        </div>

        <div class="section-title">รายละเอียดเพิ่มเติม</div>

        <div class="field full">
          <label for="Qualifications">คุณสมบัติผู้สมัคร</label>
          <textarea
            id="Qualifications"
            name="Qualifications"
            maxlength="5000"
            placeholder="เช่น อายุ วุฒิการศึกษา ประสบการณ์ และทักษะที่ต้องการ"
          ></textarea>
        </div>

        <div class="field full">
          <label for="JobDescription">
            รายละเอียดงาน <span class="required">*</span>
          </label>
          <textarea
            id="JobDescription"
            name="JobDescription"
            maxlength="10000"
            required
            placeholder="ระบุหน้าที่รับผิดชอบ ลักษณะงาน และข้อมูลสำคัญอื่น ๆ"
          ></textarea>
        </div>

      </div>

      <button id="submitButton" type="submit">
        ส่งข้อมูลความต้องการบุคลากร
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("jobRequestForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(type, text) {
      message.className = type;
      message.textContent = text;
      message.style.display = "block";
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      if (
        typeof google === "undefined" ||
        !google.script ||
        !google.script.run
      ) {
        showMessage(
          "error",
          "ไม่สามารถเชื่อมต่อระบบบันทึกข้อมูลได้ กรุณาเปิดหน้า Web App ของ ATWORK อีกครั้ง"
        );
        return;
      }

      const data = {};
      new FormData(form).forEach(function(value, key) {
        data[key] = value;
      });

      button.disabled = true;
      button.textContent = "กำลังบันทึกข้อมูล...";
      message.style.display = "none";

      google.script.run
        .withSuccessHandler(function(result) {
          button.disabled = false;
          button.textContent = "ส่งข้อมูลความต้องการบุคลากร";

          if (result && result.success === false) {
            showMessage(
              "error",
              result.message || "ไม่สามารถบันทึกข้อมูลได้ กรุณาตรวจสอบข้อมูลแล้วลองอีกครั้ง"
            );
            return;
          }

          let successText = "ส่งข้อมูลความต้องการบุคลากรเรียบร้อยแล้ว";

          if (result && result.requestId) {
            successText += "\nเลขที่รายการ: " + result.requestId;
          }

          if (result && result.message) {
            successText = result.message;
            if (result.requestId) {
              successText += "\nเลขที่รายการ: " + result.requestId;
            }
          }

          showMessage("success", successText);
          form.reset();
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          button.textContent = "ส่งข้อมูลความต้องการบุคลากร";

          showMessage(
            "error",
            error && error.message
              ? "บันทึกข้อมูลไม่สำเร็จ: " + error.message
              : "บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง"
          );
        })
        .submitJobRequest(data);
    });
  </script>
</body>
</html>
